<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowDesk Google Flow Studio</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-border: #1e293b;
      --accent-flow: #6366f1;
      --accent-purple: #a855f7;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --success: #10b981;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-flow), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }
    .title { font-size: 16px; font-weight: 700; }
    .credits-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #c7d2fe;
    }
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .video-wrap {
      width: 100%;
      height: 320px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .player-controls-wrap {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .model-tag {
      font-size: 11px;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      color: #94a3b8;
      font-family: monospace;
    }
    .prompt-box {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-flow);
    }
    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-flow), var(--accent-purple));
      color: #fff;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid var(--card-border);
    }
    .btn:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">Google Flow Video Generator</div>
        <div style="font-size: 11px; color: var(--text-dim);">Live MCP App Studio</div>
      </div>
    </div>
    <div class="credits-badge">
      <span>⚡ Credits:</span>
      <strong id="credits-val">85 / 100</strong>
    </div>
  </div>

  <div class="player-card">
    <div class="video-wrap">
      <video id="flow-video" controls autoplay loop muted poster="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800">
        <source id="video-src" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="player-controls-wrap">
      <div class="meta-row">
        <span class="model-tag" id="model-tag">Model: abra_t2v_8s</span>
        <span style="font-size: 11px; color: var(--success);" id="gen-status">● Complete (8.2s generated)</span>
      </div>
      <div class="prompt-box" id="prompt-text">
        Cinematic hyper-realistic anime cyberpunk city with neon reflections, dynamic flying vehicle swooping down camera lens, 4k 60fps render.
      </div>
      <div class="actions-row">
        <button class="btn btn-primary" onclick="triggerFlowAction('extend')">⚡ Extend Scene (+5s)</button>
        <button class="btn btn-secondary" onclick="triggerFlowAction('download')">⬇️ Download MP4</button>
        <button class="btn btn-secondary" onclick="triggerFlowAction('reroll')">🔄 Regenerate</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'flowdesk_flow_media') {
        const p = event.data.payload
        if (p.videoUrl) {
          const v = document.getElementById('flow-video')
          document.getElementById('video-src').src = p.videoUrl
          v.load()
        }
        if (p.prompt) document.getElementById('prompt-text').textContent = p.prompt
        if (p.modelKey) document.getElementById('model-tag').textContent = 'Model: ' + p.modelKey
        if (p.credits) document.getElementById('credits-val').textContent = p.credits
      }
    })

    function triggerFlowAction(action) {
      if (window.parent) {
        window.parent.postMessage({ type: 'mcp_app_action', action }, '*')
      }
      alert(`[FlowDesk Flow Action] Triggered: ${action}`)
    }
  </script>
</body>
</html>
